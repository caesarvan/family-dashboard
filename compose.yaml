name: family-dashboard
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      TRUST_PROXY: '1'
      COOKIE_SECURE: '1'
      DATA_DIR: /data
    volumes:
      - household-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
  sync:
    image: family-dashboard-app
    command: [python, sync_worker.py]
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - household-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    mem_limit: 192m
    depends_on:
      app:
        condition: service_healthy
  media:
    image: family-dashboard-app
    command: [python, -B, media_import_worker.py]
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - household-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    stop_grace_period: 360s
    depends_on:
      app:
        condition: service_healthy
  web:
    image: nginx:stable-alpine@sha256:dc5069ad14f19660b141b21236140b91656bf89bbc3e2417c70ae650cd66104c
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /var/lib/family-dashboard/letsencrypt:/etc/letsencrypt:ro
      - /var/lib/family-dashboard/acme:/var/www/acme:ro
    depends_on:
      app:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    mem_limit: 96m
volumes:
  household-data:
