log_format household_safe '$remote_addr $request_method $uri $status';
access_log /var/log/nginx/access.log household_safe;

server {
    access_log /var/log/nginx/access.log household_safe;
    listen 80;
    server_name 96.44.160.28;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://96.44.160.28$request_uri; }
}
server {
    access_log /var/log/nginx/access.log household_safe;
    listen 80;
    server_name home.caesarcharles.world;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://home.caesarcharles.world$request_uri; }
}
server {
    access_log /var/log/nginx/access.log household_safe;
    listen 443 ssl;
    server_name home.caesarcharles.world;
    ssl_certificate /etc/letsencrypt/live/family-dashboard-domain/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/family-dashboard-domain/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    server_tokens off;
    client_max_body_size 8m;
    add_header Strict-Transport-Security 'max-age=604800' always;
    # Every household uses this same API path; /space/<slug> only sets a cookie.
    # Do not buffer raw originals into Nginx client-body temporary files.
    location ~ "^/api/media/local-imports/[a-f0-9]{24}/files/[a-f0-9]{24}$" {
        limit_except PUT { deny all; }
        client_max_body_size 8m;
        client_body_timeout 30s;
        client_body_in_file_only off;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 50s;
    }
    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 50s;
    }
}
